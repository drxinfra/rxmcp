name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: hack/leakcheck.sh
      - run: go test ./...
      - run: hack/build.sh "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/drxinfra/rxmcp:${{ github.ref_name }}
            ghcr.io/drxinfra/rxmcp:latest
  # Публикация в официальный MCP Registry. Вход через OIDC GitHub: секреты не нужны,
  # право на имя io.github.drxinfra/* подтверждается самим репозиторием.
  registry:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Версия из тега в server.json
        run: |
          V="${GITHUB_REF_NAME#v}"
          jq --arg v "$V" --arg img "ghcr.io/drxinfra/rxmcp:${GITHUB_REF_NAME}" \
            '.version = $v | .packages[0].identifier = $img' server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Установка mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
